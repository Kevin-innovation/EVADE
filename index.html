<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVADE</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="main-menu" class="screen visible">

    <div id="char-select" class="screen hidden">

        <div class="char-grid">
            <button class="char-card" data-char="Aegis">

                  <div class="char-desc">洹쇱젒 ?깆빱. 諛⑹뼱/愿묒뿭 ?쒖뼱.</div>
                  <div class="char-stats">HP ?믪쓬, 諛⑹뼱 ?믪쓬, ?댁냽 蹂댄넻</div>
                </div>
            </button>
            <button class="char-card" data-char="Lumina">
                <img class="char-img" src="img/2.png" alt="Lumina">
                <div>
                  <div class="char-name">猷⑤???(Lumina)</div>
                  <div class="char-desc">?먭굅由?愿묒뿭 留덈쾿??</div>
                  <div class="char-stats">怨듦꺽???믪쓬, ?댁냽 蹂댄넻</div>
                </div>
            </button>
            <button class="char-card" data-char="Sylva">
                <img class="char-img" src="img/3.png" alt="Sylva">
                <div>
                  <div class="char-name">?ㅻ컮 (Sylva)</div>
                  <div class="char-desc">洹몃┝??沅곸닔. 愿???붿궡/吏?띾뵜.</div>
                  <div class="char-stats">?먭굅由? ?댁냽 蹂댄넻</div>
                </div>
            </button>
            <button class="char-card" data-char="Zed">
                <img class="char-img" src="img/4.png" alt="Zed">
                <div>
                  <div class="char-name">?쒕뱶 (Zed)</div>
                  <div class="char-desc">諛ㅼ쓽 ?붿궡?? 湲곗뒿/?뚰뵾.</div>
                  <div class="char-stats">洹쇱젒, 湲곕룞??/div>
                </div>
            </button>
            <button class="char-card" data-char="Gaia">
                <img class="char-img" src="img/5.png" alt="Gaia">
                <div>
                  <div class="char-name">媛?댁븘 (Gaia)</div>
                  <div class="char-desc">?吏???뚯닔袁? 諛⑸꼍/異⑷꺽??</div>
                  <div class="char-stats">?깆빱, ?쒖뼱</div>
                </div>
            </button>
            <button class="char-card" data-char="Seraph">
                <img class="char-img" src="img/6.png" alt="Seraph">
                <div>
                  <div class="char-name">?몃씪??(Seraph)</div>
                  <div class="char-desc">?곹샎 移섏쑀?? ?뚮났/蹂댄샇.</div>
                  <div class="char-stats">吏?먭?, ?앹〈</div>
                </div>
            </button>
            <button class="char-card" data-char="Chrono">
                <img class="char-img" src="img/7.png" alt="Chrono">
                <div>
                  <div class="char-name">?щ줈??(Chrono)</div>
                  <div class="char-desc">?쒓컙 ?ы뻾?? ?쒓컙 ?쒓끝.</div>
                  <div class="char-stats">?쒖뼱, 踰꾩뒪??/div>
                </div>
            </button>
            <button class="char-card" data-char="Mad-doc">
                <img class="char-img" src="img/8.png" alt="Mad-doc">
                <div>
                  <div class="char-name">留ㅻ뱶??(Mad-doc)</div>
                  <div class="char-desc">誘몄튂愿묒씠 ?곌툑?좎궗. ??빟/?붾쾭??</div>
                  <div class="char-stats">吏?띾뵜, 蹂移?/div>
                </div>
            </button>
        </div>
        <div class="menu-buttons">
            <button id="btn-char-back">?ㅻ줈</button>
            <button id="btn-char-play" disabled>?좏깮?섍퀬 ?쒖옉</button>
        </div>
    </div>

    <div id="upgrades-menu" class="screen hidden">
        <h2 class="title" style="font-size:28px">?곌뎄 媛뺥솕</h2>
        <div class="hint">硫뷀? 吏꾪뻾: 寃뚯엫 醫낅즺 ??怨⑤뱶媛 ?곷┰?⑸땲??</div>
        <div class="menu-wallet">蹂댁쑀 怨⑤뱶: <span id="wallet-gold">0</span></div>
        <div class="upgrade-grid">
            <button class="upgrade-card" data-upg="hp">湲곕낯 泥대젰 +10<br><small>鍮꾩슜: 20</small></button>
            <button class="upgrade-card" data-upg="power">湲곕낯 怨듦꺽??+5%<br><small>鍮꾩슜: 30</small></button>
            <button class="upgrade-card" data-upg="gold">怨⑤뱶 ?띾뱷 +10%<br><small>鍮꾩슜: 25</small></button>
            <button class="upgrade-card" data-upg="xp">寃쏀뿕移??띾뱷 +5%<br><small>鍮꾩슜: 25</small></button>
        </div>
        <div class="menu-buttons">
            <button id="btn-upg-back">?ㅻ줈</button>
        </div>
    </div>

    <div id="settings-menu" class="screen hidden">
        <h2 class="title" style="font-size:28px">?ㅼ젙</h2>
        <div class="menu-wallet" style="margin-bottom:4px">?ㅻ뵒???ㅼ젙</div>
        <div style="display:grid;gap:10px;min-width:280px">
            <label>留덉뒪??蹂쇰ⅷ: <input id="vol-master" type="range" min="0" max="100" value="70"> <span id="vol-label">70</span>%</label>
            <label><input id="mute-toggle" type="checkbox"> ?뚯냼嫄?(?⑥텞?? M)</label>
        </div>
        <div class="menu-buttons" style="margin-top:10px">
            <button id="btn-settings-back">?ㅻ줈</button>
        </div>
    </div>

    <div id="hud" class="hud hidden">
        <div class="hud-left">
            <div class="hp-label">HP</div>
            <div class="bar hp"><div class="fill" id="hp-fill"></div></div>
            <div class="xp-row">
                <span class="level" id="level-label">Lv 1</span>
                <div class="bar xp"><div class="fill" id="xp-fill"></div></div>
            </div>
        </div>
        <div class="hud-center">
            <div class="time" id="time-label">00:00</div>
            <div class="skills-row">
                <div class="skill" id="skill-Q"><div class="mask"></div><div class="label">Q</div><div class="cd">0</div></div>
                <div class="skill" id="skill-W"><div class="mask"></div><div class="label">W</div><div class="cd">0</div></div>
                <div class="skill" id="skill-E"><div class="mask"></div><div class="label">E</div><div class="cd">0</div></div>
                <div class="skill" id="skill-R"><div class="mask"></div><div class="label">R</div><div class="cd">0</div></div>
            </div>
        </div>
        <div class="hud-right">
            <div>泥섏튂: <span id="kill-count">0</span></div>
            <div>怨⑤뱶: <span id="gold-count">0</span></div>
            <div>Wave: <span id="wave-label">1-1</span></div>
        </div>
    </div>

    <div id="bossbar" class="bossbar hidden">
        <div class="boss-name" id="boss-name">Boss</div>
        <div class="bar boss"><div class="fill" id="boss-fill"></div></div>
    </div>

    <div id="levelup-overlay" class="overlay hidden">
        <div class="card-panel">
            <h2>?덈꺼 ??</h2>
            <p>?섎굹瑜??좏깮?섏꽭??/p>
            <div class="cards">
                <button class="card" data-slot="0"></button>
                <button class="card" data-slot="1"></button>
                <button class="card" data-slot="2"></button>
            </div>
        </div>
    </div>

    <div id="gameover-overlay" class="overlay hidden">
        <div class="card-panel">
            <h2>寃뚯엫 ?ㅻ쾭</h2>
            <div class="results">
                <div>?앹〈 ?쒓컙: <span id="result-time">00:00</span></div>
                <div>理쒖쥌 Wave: <span id="result-wave">1-1</span></div>
                <div>泥섏튂 ?? <span id="result-kills">0</span></div>
                <div>?띾뱷 怨⑤뱶: <span id="result-gold">0</span></div>
            </div>
            <div class="menu-buttons">
                <button id="btn-retry">?ㅼ떆 ?섍린</button>
                <button id="btn-exit">硫붿씤 硫붾돱</button>
            </div>
        </div>
    </div>

    <div id="pause-overlay" class="overlay hidden">
        <div class="card-panel">
            <h2>?쇱떆 ?뺤?</h2>
            <div class="menu-buttons">
                <button id="btn-resume">怨꾩냽?섍린 (ESC)</button>
                <button id="btn-exit2">硫붿씤 硫붾돱</button>
            </div>
        </div>
    </div>

    <canvas id="game"></canvas>

    <div id="wavebar" class="wavebar hidden">
        <div class="wave-info"><span id="wave-text">Stage 1 ??Wave 1</span><span class="wave-eta" id="wave-eta">+30.0s</span></div>
        <div class="bar wave"><div class="fill" id="wave-fill"></div></div>
    </div>

    <script src="scripts.js" charset="utf-8" defer></script>
</body>
</html>
